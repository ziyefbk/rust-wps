[package]
name = "rust-wps-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.17"
rust-wps = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
lopdf = { version = "=0.42.0", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
