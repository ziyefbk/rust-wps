name: Windows Word native acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-word-native.yml'

permissions:
  contents: read

concurrency:
  group: windows-word-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  word-native:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Select fixed Rust MSRV
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.88.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record source, tools, WebView2 and fonts
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version --verbose
          node --version
          npm --version
          python --version
          Write-Output "Runner image: $env:ImageOS $env:ImageVersion"
          $edgeRoots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application")
          $webviews = @(Get-ChildItem -Path $edgeRoots -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue)
          if ($webviews.Count -eq 0) { throw 'Installed WebView2 runtime not found; no automatic installer fallback' }
          $webviews | ForEach-Object { Write-Output "$($_.FullName) $($_.VersionInfo.FileVersion)" }
          Get-ChildItem "$env:WINDIR\Fonts" -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            Write-Output "FONT $($_.Name) $hash"
          }
      - name: Install locked JavaScript and fixed independent readers
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check python-docx==1.1.2 pypdf==6.10.0 lxml==5.3.2 typing_extensions==4.13.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze
      - name: Build real CLI and native-smoke Tauri app
        run: |
          cargo build --locked --bin rust-wps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec -- tauri build --debug --no-bundle --features native-smoke -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash target/debug/rust-wps.exe, src-tauri/target/debug/rust-wps-desktop.exe -Algorithm SHA256
      - name: Save, independently read, reopen and print through native IPC
        id: acceptance
        timeout-minutes: 10
        run: |
          $env:RUST_WPS_SMOKE_PYTHON = (Get-Command python).Source
          node scripts/native-word-style-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print bounded evidence to job logs
        if: always()
        run: |
          if (Test-Path tmp/native-word-style) {
            Get-ChildItem tmp/native-word-style -Recurse -File | Where-Object {
              $_.Name -in @('report.json', 'failure-state.json', 'docx-inspection.json', 'pdf-inspection.json', 'native-process.log')
            } | ForEach-Object {
              Write-Output "EVIDENCE $($_.FullName)"
              Get-Content -LiteralPath $_.FullName -TotalCount 1500
            }
          }
      - name: Summarize exact run outcome
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          @"
          ## Windows Word native acceptance
          - Commit: $env:GITHUB_SHA
          - Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          - Native acceptance step (including cleanup): $env:ACCEPTANCE_OUTCOME
          - Evidence: job logs only; DOCX/PDF/screenshots are not uploaded
          - Boundary: smoke path overrides; no native dialogs, IME, clipboard, installer or general fidelity acceptance
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
